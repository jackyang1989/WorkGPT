[package]
name = "workgpt-tool-runtime-contracts"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
experimental-code-mode = ["workgpt-tool-contracts/experimental-code-mode"]
workspace-checkpoints = ["workgpt-tool-contracts/workspace-checkpoints"]

[dependencies]
workgpt-core = { path = "../workgpt-core" }
workgpt-tool-contracts = { path = "../workgpt-tool-contracts" }
workgpt-workflow-session = { path = "../workgpt-workflow-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
