[package]
name = "workgpt-validation"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
# Preserve the pre-feature-split public surface for ordinary consumers. The
# Runner explicitly disables defaults because it only needs recipes/adapters.
default = ["session-evidence"]
session-evidence = ["dep:workgpt-tool-contracts", "dep:workgpt-workflow-session"]

[dependencies]
workgpt-core = { path = "../workgpt-core" }
workgpt-tool-contracts = { path = "../workgpt-tool-contracts", optional = true }
workgpt-workflow-session = { path = "../workgpt-workflow-session", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
workgpt-tool-contracts = { path = "../workgpt-tool-contracts", features = ["root-test-support"] }
workgpt-tool-runtime-contracts = { path = "../workgpt-tool-runtime-contracts" }
workgpt-workflow-session = { path = "../workgpt-workflow-session", features = ["root-test-support"] }
