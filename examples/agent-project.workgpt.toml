id = "workgpt"
path = "/path/to/workgpt"
name = "workgpt"
kind = "rust"
shell_profile = "rust"
description = "WorkGPT server and agent"
disabled = false

[hooks]
doctor = [
  "git status --short",
  "git log --oneline -5"
]

precommit = [
  ". /root/.cargo/env && cargo fmt --check",
  ". /root/.cargo/env && cargo test"
]
