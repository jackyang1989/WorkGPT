    "workgpt-core",
    "workgpt-tool-contracts",
    "workgpt-workflow-session",
]
dev = [
    "workgpt-tool-contracts",
    "workgpt-tool-runtime-contracts",
    "workgpt-workflow-session",
]
build = []
test_support = [
    "workgpt-tool-contracts",
    "workgpt-workflow-session",
]

[packages.workgpt-workflow-session]
layer = "domain"
role = "Workflow Session continuity, evidence, and handoff domain."
normal = ["workgpt-core", "workgpt-tool-contracts"]
dev = []
build = []
test_support = []

[packages.workgpt-workspace]
layer = "domain"
role = "Registered project/workspace path and metadata contracts."
normal = ["workgpt-core"]
dev = []
build = []
test_support = []
